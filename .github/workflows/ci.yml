name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test (unit + H2 requirements + Testcontainers PostgreSQL)
        run: mvn -B verify
      - name: Build Docker image
        working-directory: .
        run: docker build -t notification-platform ./backend
